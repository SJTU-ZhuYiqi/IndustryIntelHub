<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报告详情 | Content Intel Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body class="report-page">

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner container">
      <a href="index.html" class="logo-lockup logo-lockup--link">
        <span class="logo-icon">◈</span>
        <div class="logo-text">
          <span class="logo-en">CONTENT INTEL HUB</span>
          <span class="logo-cn">内容消费行业资讯</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="nav-link nav-link--back">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <path d="M11 7H3M6 4L3 7l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          返回首页
        </a>
      </nav>
    </div>
  </header>

  <!-- ── REPORT HERO ────────────────────────────────────────── -->
  <section class="report-hero" id="report-hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-orb hero-orb--1"></div>
    <div class="hero-orb hero-orb--2"></div>
    <div class="container report-hero-content">
      <div class="report-week-badge" id="report-week-badge">---</div>
      <h1 class="report-title" id="report-title">正在加载报告…</h1>
      <div class="report-meta-row" id="report-meta-row"></div>
      <div class="report-tags" id="report-tags"></div>
    </div>
  </section>

  <!-- ── HIGHLIGHTS ─────────────────────────────────────────── -->
  <section class="highlights-section container" id="highlights-section">
    <div class="section-eyebrow">
      <span class="dot dot--live"></span>
      本期要点
    </div>
    <ul class="highlights-list" id="highlights-list"></ul>
  </section>

  <!-- ── REPORT BODY ────────────────────────────────────────── -->
  <div class="report-body-wrap">
    <div class="container report-layout">
      <aside class="toc-sidebar" id="toc-sidebar">
        <div class="toc-title">目录</div>
        <nav class="toc-nav" id="toc-nav"></nav>
      </aside>
      <article class="report-content markdown-body" id="report-content"></article>
    </div>
  </div>

  <!-- ── FOOTER NAV ─────────────────────────────────────────── -->
  <div class="report-footer-nav container" id="report-footer-nav"></div>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-logo">◈ CONTENT INTEL HUB</span>
      <span class="footer-copy">数据仅供参考，不构成投资建议</span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
